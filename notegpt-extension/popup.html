<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NoteGPT</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        width: 280px;
        padding: 12px;
        margin: 0;
        background: #f7f7fa;
      }
      h1 { font-size: 16px; margin: 0 0 10px; }
      p { margin: 0 0 10px; color: #5f6470; font-size: 12px; }
      button {
        width: 100%; border: none; border-radius: 8px; padding: 10px;
        margin-bottom: 8px; background: #3b82f6; color: #fff; cursor: pointer;
      }
      button.secondary { background: #111827; }
    </style>
  </head>
  <body>
    <h1>NoteGPT</h1>
    <p>捕捉当前 ChatGPT 对话，在页面里做高亮/批注并导出 PDF。</p>
    <button id="capture">捕捉并打开笔记区</button>
    <button id="export" class="secondary">导出 PDF</button>
    <script src="popup.js"></script>
  </body>
</html>
